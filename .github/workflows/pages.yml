# Deployed as .github/workflows/pages.yml in Alahmmed/alahmeds-study.
# Keep the existing Pages custom domain and HTTPS settings; set Source to GitHub Actions.
# The repository root already contains the compiled public site. No course builder runs here.
name: Deploy compiled study site

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Alahmmed/alahmeds-study' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the compiled site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Read existing Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Verify compiled root and existing domain
        shell: bash
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: |
          set -euo pipefail
          test "$PAGES_HOST" = 'alahmeds.com'
          test -s index.html
          test -s macroeconomics.html
          test -f .nojekyll
          test "$(tr -d '\r\n' < CNAME)" = 'alahmeds.com'

      - name: Upload the compiled root
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '.'
          include-hidden-files: true # Keeps .nojekyll; the action always excludes .git and .github.
          retention-days: 1

      - name: Deploy the uploaded site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
